name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uv run ruff check src tests
      # Unit tests need no models. The end-to-end tests skip themselves unless
      # `silo models pull` has been run.
      - run: uv run pytest -q
